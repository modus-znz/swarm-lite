[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "swarm-lite"
version = "0.1.0"
description = "Ultra-low-token 30+ agent swarm orchestration engine with dynamic adaptive lifecycle control"
readme = "README.md"
authors = [
    { name = "Modus ZNZ", email = "security@moduslabs.dev" }
]
license = { text = "MIT" }
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
keywords = ["ai-agents", "swarm", "orchestration", "token-optimization", "python"]
requires-python = ">=3.9"
dependencies = []

[project.scripts]
swarm-lite = "swarm_lite.cli:main"

[project.urls]
Homepage = "https://github.com/modus-znz/swarm-lite"
Repository = "https://github.com/modus-znz/swarm-lite.git"
Issues = "https://github.com/modus-znz/swarm-lite/issues"
